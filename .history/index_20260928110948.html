<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>7 Day Life Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="brand">
                <h1>My 7-Day Life Tracker</h1>
                <p id="weekLabel"></p>
            </div>

            <div class="header-actions">

                <button class="secondary-btn" onclick="openCategoryManager()">
                    ⚙ Categories
                </button>

                <div class="date-control">

                    <label>Select Date</label>

                    <input
                        type="date"
                        id="datePicker"
                    >

                </div>

            </div>

        </header>


        <!-- ================= DASHBOARD ================= -->

        <section class="dashboard">

            <div class="card">

                <span>Weekly Progress</span>

                <strong id="overall">
                    0%
                </strong>

            </div>


            <div class="card">

                <span>Completed</span>

                <strong id="completed">
                    0
                </strong>

            </div>


            <div class="card">

                <span>Remaining</span>

                <strong id="remaining">
                    0
                </strong>

            </div>


            <div class="card">

                <span>Streak</span>

                <strong id="streak">
                    0 🔥
                </strong>

            </div>

        </section>


        <main>

            <!-- ================= WEEK CALENDAR ================= -->

            <section class="box">

                <div class="section-title">

                    <div>
                        <h2>7-Day Calendar</h2>
                    </div>

                    <button
                        class="primary-btn"
                        onclick="goToday()"
                    >
                        Today
                    </button>

                </div>

                <div
                    id="week"
                    class="week"
                ></div>

            </section>


            <!-- ================= CONTENT ================= -->

            <div class="content-grid">


                <!-- ================= TASK SECTION ================= -->

                <section class="box">

                    <div class="section-title">

                        <div>

                            <h2 id="selectedDayTitle">
                                Daily Tasks
                            </h2>

                            <p class="section-description">
                                Customize your routine for this day.
                            </p>

                        </div>

                        <button
                            class="primary-btn"
                            onclick="openTaskModal()"
                        >
                            + Add Task
                        </button>

                    </div>


                    <div id="taskList"></div>

                </section>


                <!-- ================= PROGRESS ================= -->

                <aside class="box">

                    <div class="section-title">

                        <h2>Category Progress</h2>

                        <button
                            class="icon-btn"
                            onclick="openCategoryManager()"
                        >
                            ⚙
                        </button>

                    </div>

                    <div id="categoryProgress"></div>

                </aside>

            </div>

        </main>


        <!-- ================= FOOTER ================= -->

        <footer>
            © 2026 SAIFUL ISLAM
        </footer>

    </div>



    <!-- =====================================================
         CATEGORY MODAL
    ====================================================== -->

    <div
        id="categoryModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-header">

                <h2>Manage Categories</h2>

                <button
                    class="close-btn"
                    onclick="closeCategoryManager()"
                >
                    ×
                </button>

            </div>


            <div
                id="categoryList"
                class="category-list"
            ></div>


            <button
                class="primary-btn full-btn"
                onclick="openCategoryForm()"
            >
                + Add Category
            </button>

        </div>

    </div>



    <!-- =====================================================
         CATEGORY FORM MODAL
    ====================================================== -->

    <div
        id="categoryFormModal"
        class="modal hidden"
    >

        <div class="modal-box small-modal">

            <div class="modal-header">

                <h2 id="categoryFormTitle">
                    Add Category
                </h2>

                <button
                    class="close-btn"
                    onclick="closeCategoryForm()"
                >
                    ×
                </button>

            </div>


            <form id="categoryForm">

                <label>
                    Category Name
                </label>

                <input
                    type="text"
                    id="categoryName"
                    placeholder="Example: Gym"
                    required
                >


                <label>
                    Icon
                </label>

                <input
                    type="text"
                    id="categoryIcon"
                    placeholder="Example: 🏋️"
                    maxlength="4"
                >


                <label>
                    Color
                </label>

                <input
                    type="color"
                    id="categoryColor"
                    value="#2563eb"
                >


                <div class="form-buttons">

                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="closeCategoryForm()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Category
                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- =====================================================
         TASK MODAL
    ====================================================== -->

    <div
        id="taskModal"
        class="modal hidden"
    >

        <div class="modal-box small-modal">

            <div class="modal-header">

                <h2 id="taskFormTitle">
                    Add Task
                </h2>

                <button
                    class="close-btn"
                    onclick="closeTaskModal()"
                >
                    ×
                </button>

            </div>


            <form id="taskForm">

                <label>
                    Task Title
                </label>

                <input
                    type="text"
                    id="taskName"
                    placeholder="Example: Programming Practice"
                    required
                >


                <label>
                    Description
                </label>

                <input
                    type="text"
                    id="taskDescription"
                    placeholder="Example: Practice JavaScript for 1 hour"
                >


                <label>
                    Category
                </label>

                <select
                    id="taskCategory"
                    required
                ></select>


                <label>
                    Time
                </label>

                <input
                    type="text"
                    id="taskTime"
                    placeholder="Example: 7:00 PM - 8:00 PM"
                >


                <div class="form-buttons">

                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="closeTaskModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Task
                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
